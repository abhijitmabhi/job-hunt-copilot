services:
  pgvector:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: jobhunt
      POSTGRES_USER: jobhunt
      POSTGRES_PASSWORD: jobhunt
    ports:
      - "5434:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunt -d jobhunt"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - "org.springframework.boot.service-connection=postgres"

  ollama:
    image: ollama/ollama:0.40.18
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # Start the server, pull the embedding model once (skipped if already in the volume), keep running.
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull nomic-embed-text:v1.5 && wait"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q nomic-embed-text"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  pgvector-data:
  ollama-data:
