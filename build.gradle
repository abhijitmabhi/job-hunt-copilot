plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

group = 'com.ama'
version = '0.0.1-SNAPSHOT'
description = 'job-hunt-copilot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.webmvc
    implementation platform(libs.spring.ai.bom)
    implementation libs.spring.ai.starter.model.anthropic
    implementation libs.spring.ai.starter.model.ollama
    implementation libs.spring.ai.starter.vector.store.pgvector
    implementation libs.spring.ai.markdown.document.reader
    implementation libs.spring.ai.pdf.document.reader
    implementation libs.jsoup
    developmentOnly libs.spring.boot.docker.compose
    developmentOnly libs.spring.ai.spring.boot.docker.compose
    compileOnly libs.lombok
    annotationProcessor libs.lombok
    testImplementation libs.spring.boot.starter.actuator.test
    testImplementation libs.spring.boot.starter.validation.test
    testImplementation libs.spring.boot.starter.webmvc.test
    testImplementation libs.spring.boot.testcontainers
    testImplementation libs.testcontainers.junit.jupiter
    testCompileOnly libs.lombok
    testRuntimeOnly libs.junit.platform.launcher
    testAnnotationProcessor libs.lombok
}

tasks.named('test') {
    useJUnitPlatform()
}
